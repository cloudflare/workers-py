[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "django-cf"
version = "0.2.14"
authors = [
  { name="Gabriel Massadas" },
]
dependencies = [
  'sqlparse',
  'workers-runtime-sdk>=1.6.0',
]
description = "django-cf is a package that integrates Django with Cloudflare products"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12"
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "requests",
    "ruff",
    "django",
]

[project.urls]
"Homepage" = "https://github.com/cloudflare/workers-py"
"Bug Reports" = "https://github.com/cloudflare/workers-py/issues"
"Source" = "https://github.com/cloudflare/workers-py"

[tool.setuptools.packages.find]
where = ["."]
include = ["django_cf", "django_cf.*"]
exclude = ["tests*", "docs*", "templates*", ".github*", "*.__pycache__"]

[tool.ruff]
target-version = "py312"
extend-exclude = [".wrangler", "python_modules", "staticfiles"]
lint.select = [
  "B0",     # bugbear (all B0* checks enabled by default)
  "B904",   # bugbear (Within an except clause, raise exceptions with raise ... from err)
  "B905",   # bugbear (zip() without an explicit strict= parameter set.)
  "C4",     # flake8-comprehensions
  "C9",     # mccabe complexity
  "E",      # pycodestyles
  "F",      # pyflakes
  "I",      # isort
  "PERF",   # Perflint
  "PGH",    # pygrep-hooks
  "PL",     # Pylint
  "UP",     # pyupgrade
  "W",      # pycodestyles
]
lint.ignore = [
  # Shared across every package in this monorepo.
  "E402",
  "E501",
  "E731",
  "E741",
  "PLW2901",
  "UP031",
  # Deferred: satisfying these requires behavioural or structural changes to
  # code imported from https://github.com/G4brym/django-cf, so they are turned
  # off to keep the lint adoption commit mechanical. Re-enable one rule per PR.
  "B904",    # `raise ... from err` alters exception chaining and tracebacks
  "B905",    # `zip(strict=True)` can raise where the loose zip silently truncates
  "C901",    # too complex; needs function decomposition (also ignored by runtime-sdk)
  "PERF401", # manual-list-comprehension; needs a loop rewrite
  "PLR0911", # too many return statements (also ignored by runtime-sdk)
  "PLR0912", # too many branches; needs decomposition
  "PLR0913", # too many arguments; signature change
  "PLR0915", # too many statements (also ignored by runtime-sdk)
  "PLR2004", # magic value comparison; needs named constants
  "PLW0603", # global statement; architectural, see db/backends/do/storage.py
  "UP038",   # `isinstance(x, X | Y)` (also ignored by runtime-sdk)
]
lint.flake8-comprehensions.allow-dict-calls-with-keyword-arguments = true
# Generated Django scaffolding kept verbatim so it stays copy-pasteable.
lint.per-file-ignores."tests/servers/**" = ["F401"]
lint.per-file-ignores."templates/**" = ["F401"]

[tool.pytest.ini_options]
minversion = "6.0"
# TODO: e2e tests are flaky. Enable or refactor test cases
addopts = ["-ra", "--ignore=tests/e2e", "--ignore=tests/in_worker/worker/src"]
testpaths = [
    "tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["django_cf"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.semantic_release]
assets = []
build_command_env = []
commit_message = """\
Release django-cf {version}

Automatically generated by python-semantic-release
"""
commit_parser = "conventional-monorepo"
logging_use_named_masks = false
# django-cf is still on a 0.x version, unlike the two 1.x sibling packages, so a
# feat bumps the minor rather than forcing 1.0.0.
major_on_zero = false
allow_zero_version = true
no_git_verify = false
tag_format = "django-cf-v{version}"
version_toml = ["pyproject.toml:project.version"]
build_command = """
  pip install uv
  uv lock --upgrade-package "$PACKAGE_NAME"
  git add uv.lock
  uv build
"""

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '''chore(?:\([^)]*?\))?: .+''',
    '''ci(?:\([^)]*?\))?: .+''',
    '''refactor(?:\([^)]*?\))?: .+''',
    '''style(?:\([^)]*?\))?: .+''',
    '''test(?:\([^)]*?\))?: .+''',
    '''build\((?!deps\): .+)''',
    '''Initial [Cc]ommit.*''',
]
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"
mask_initial_release = true

[tool.semantic_release.changelog.environment]
block_start_string = "{%"
block_end_string = "%}"
variable_start_string = "{{"
variable_end_string = "}}"
comment_start_string = "{#"
comment_end_string = "#}"
trim_blocks = false
lstrip_blocks = false
newline_sequence = "\n"
keep_trailing_newline = false
extensions = []
autoescape = false

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "semantic-release <semantic-release>"

[tool.semantic_release.commit_parser_options]
path_filters = [".", "!tests/**", "!templates/**"]
scope_prefix = "django-cf"
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
other_allowed_tags = ["build", "chore", "ci", "docs", "style", "refactor", "test"]
allowed_tags = ["feat", "fix", "perf", "build", "chore", "ci", "docs", "style", "refactor", "test"]
default_bump_level = 0
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = false
insecure = false

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
