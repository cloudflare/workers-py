[project]
name = "bindings-test"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pytest",
    "pytest-asyncio<1.2.0",
    # These are for hyperdrive tests
    "pg8000",
    "pymysql",
    "aiomysql",
    "psycopg[binary]; python_version >= '3.14'",
    "asyncpg; python_version >= '3.14'",
    "cryptography",
    "testlib",
    "workers-runtime-sdk",
]

[tool.uv.sources]
testlib = { path = "../packages/testlib" }
workers-runtime-sdk = { path = "../packages/runtime-sdk" }
